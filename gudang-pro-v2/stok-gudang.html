<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stok Gudang — Gudang Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h1>Stok Gudang</h1>
        </div>
      </div>
      <div class="content">
        <div class="card" style="margin-bottom:16px;">
          <h2>Tambah Item Baru</h2>
          <form id="item-form">
            <div class="form-row">
              <div class="field"><label>SKU</label><input type="text" id="sku" required placeholder="Contoh: RM-0001"></div>
              <div class="field"><label>Nama Item</label><input type="text" id="name" required></div>
            </div>
            <div class="form-row">
              <div class="field"><label>Kategori</label><input type="text" id="category" placeholder="Contoh: Bahan Baku"></div>
              <div class="field"><label>Satuan</label><input type="text" id="unit" required placeholder="pcs / kg / roll"></div>
            </div>
            <div class="form-row">
              <div class="field"><label>Stok Awal</label><input type="number" id="current_stock" value="0" min="0" step="any"></div>
              <div class="field"><label>Stok Minimum</label><input type="number" id="min_stock" value="0" min="0" step="any"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="btn-submit">+ Tambah Item</button>
          </form>
        </div>

        <div class="card">
          <div class="toolbar">
            <h2 style="margin:0;">Daftar Item</h2>
            <input class="search" id="search-box" placeholder="Cari SKU / nama...">
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>SKU</th><th>Nama</th><th>Kategori</th><th>Stok</th><th>Min</th><th>Satuan</th><th>Status</th></tr></thead>
              <tbody id="items-body"><tr><td colspan="7" class="loading-row">Memuat...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-host"></div>
  <script type="module" src="assets/js/pages/stok-gudang.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}</script>
</body>
</html>
