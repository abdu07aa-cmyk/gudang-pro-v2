<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - QC Professional</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon">🔍</span>
                    <span class="logo-text">QC Professional</span>
                </div>
                <p class="auth-subtitle">Quality Control System</p>
            </div>
            
            <!-- FORM LOGIN -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@company.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="toggle-password">👁️</button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Ingat saya</span>
                    </label>
                    <a href="#" class="forgot-password">Lupa password?</a>
                </div>
                
                <button type="submit" class="btn-primary btn-full" id="loginBtn">
                    <span id="loginText">Masuk</span>
                    <span id="loginLoader" class="loader-hidden">⏳</span>
                </button>
            </form>
            
            <p class="auth-footer">
                Belum punya akun? 
                <a href="#" id="registerToggle">Daftar</a>
            </p>
            
            <div class="auth-divider"><span>atau</span></div>
            
            <div class="demo-account">
                <p class="demo-label">👨‍💻 Akun Demo</p>
                <div class="demo-credentials">
                    <span>email: <strong>admin@qc.com</strong></span>
                    <span>password: <strong>Admin123!</strong></span>
                </div>
                <button type="button" id="demoLogin" class="btn-secondary btn-full">
                    Login Demo
                </button>
            </div>
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <script src="js/app.js"></script>
    
    <script>
    // ==========================================
    // INI KODE LOGIN YANG BEKERJA
    // ==========================================
    
    document.addEventListener('DOMContentLoaded', function() {
        console.log('✅ Login page loaded');
        
        // CEK APAKAH SUDAH LOGIN
        const user = getCurrentUser();
        if (user) {
            window.location.href = '/dashboard.html';
            return;
        }
        
        // ===== AMBIL ELEMENT =====
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginLoader = document.getElementById('loginLoader');
        const togglePassword = document.getElementById('togglePassword');
        const demoBtn = document.getElementById('demoLogin');
        const registerToggle = document.getElementById('registerToggle');
        
        // ===== TOGGLE PASSWORD =====
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });
        
        // ===== SUBMIT FORM LOGIN =====
        form.addEventListener('submit', async function(e) {
            // CEK APAKAH INI BEKERJA
            console.log('🔥 Form submitted!');
            e.preventDefault(); // CEK APAKAH INI BEKERJA
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            console.log('📧 Email:', email);
            console.log('🔑 Password:', password);
            
            if (!email || !password) {
                alert('⚠️ Harap isi email dan password!');
                return;
            }
            
            // LOADING
            loginText.textContent = 'Memproses...';
            loginLoader.classList.remove('loader-hidden');
            loginBtn.disabled = true;
            
            // PANGGIL FUNGSI LOGIN
            const result = await loginUser(email, password);
            console.log('📊 Result:', result);
            
            // RESET LOADING
            loginText.textContent = 'Masuk';
            loginLoader.classList.add('loader-hidden');
            loginBtn.disabled = false;
            
            if (result.success) {
                console.log('✅ Login success, redirecting...');
                window.location.href = '/dashboard.html';
            } else {
                console.error('❌ Login failed:', result.message);
                alert('❌ Login gagal: ' + result.message);
            }
        });
        
        // ===== DEMO LOGIN =====
        demoBtn.addEventListener('click', function() {
            console.log('🔄 Demo login clicked');
            emailInput.value = 'admin@qc.com';
            passwordInput.value = 'Admin123!';
            // TRIGGER SUBMIT
            form.dispatchEvent(new Event('submit'));
        });
        
        // ===== REGISTER =====
        registerToggle.addEventListener('click', function(e) {
            e.preventDefault();
            console.log('📝 Register clicked');
            
            const fullName = prompt('📝 Masukkan nama lengkap:');
            if (!fullName) return;
            
            const email = prompt('📧 Masukkan email:');
            if (!email) return;
            
            const password = prompt('🔑 Masukkan password (min 6 karakter):');
            if (!password || password.length < 6) {
                alert('Password minimal 6 karakter!');
                return;
            }
            
            registerUser(email, password, fullName).then(result => {
                if (result.success) {
                    alert('✅ Pendaftaran berhasil! Silakan login.');
                } else {
                    alert('❌ Pendaftaran gagal: ' + result.message);
                }
            });
        });
    });
    </script>
</body>
</html>
