<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - QC Professional</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="active">
            <span>🏠</span>
            <span>Dashboard</span>
        </a>
        <a href="inspection.html">
            <span>📋</span>
            <span>Inspeksi</span>
        </a>
        <a href="defect-report.html">
            <span>📊</span>
            <span>Defect</span>
        </a>
        <a href="history.html">
            <span>📜</span>
            <span>Riwayat</span>
        </a>
        <a href="#" id="logout-btn">
            <span>🚪</span>
            <span>Keluar</span>
        </a>
    </nav>
    
    <!-- Main Content -->
    <main class="main-content" style="padding: 20px; max-width: 1200px; margin: 0 auto;">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <h1 style="font-size: 24px;">📊 QC Dashboard</h1>
            <span id="user-email" style="color: #64748b; font-size: 14px; background: #f1f5f9; padding: 6px 16px; border-radius: 20px;"></span>
        </header>
        
        <!-- KPI Cards -->
        <div class="kpi-grid">
            <div class="card">
                <div style="color: #64748b; font-size: 13px;">Total Inspeksi</div>
                <div style="font-size: 28px; font-weight: 700;" id="total-inspections">0</div>
            </div>
            <div class="card">
                <div style="color: #64748b; font-size: 13px;">Defect Rate</div>
                <div style="font-size: 28px; font-weight: 700;" id="defect-rate">0%</div>
            </div>
            <div class="card">
                <div style="color: #64748b; font-size: 13px;">Passed</div>
                <div style="font-size: 28px; font-weight: 700; color: #16a34a;" id="passed">0</div>
            </div>
            <div class="card">
                <div style="color: #64748b; font-size: 13px;">Rejected</div>
                <div style="font-size: 28px; font-weight: 700; color: #dc2626;" id="rejected">0</div>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <div class="card" style="margin-top: 20px; padding: 24px; text-align: center;">
            <p style="color: #64748b; font-size: 16px; margin-bottom: 16px;">
                ✅ Dashboard siap digunakan. Mulai inspeksi sekarang!
            </p>
            <a href="inspection.html" class="btn-primary">Mulai Inspeksi</a>
        </div>
    </main>
    
    <!-- ===== JAVASCRIPT ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <script src="js/app.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Cek login
            const user = getCurrentUser();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            
            document.getElementById('user-email').textContent = '👤 ' + user.email;
            
            // Logout
            document.getElementById('logout-btn').addEventListener('click', function(e) {
                e.preventDefault();
                if (confirm('Yakin ingin keluar?')) {
                    logoutUser();
                }
            });
            
            // Load stats
            loadDashboardStats();
        });
    </script>
</body>
</html>
