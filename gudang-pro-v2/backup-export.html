<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backup & Export — Gudang Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h1>Backup & Export</h1>
        </div>
      </div>
      <div class="content">
        <div class="card" id="backup" style="margin-bottom:16px;">
          <h2>💾 Backup Data</h2>
          <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-6px;">Backup seluruh data (semua tabel) ke satu file JSON. Hanya untuk Admin.</p>
          <button class="btn btn-primary" id="btn-backup">Download Backup Lengkap (.json)</button>
        </div>

        <div class="card" id="export">
          <h2>📎 Export Data</h2>
          <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-6px;">Export data per tabel ke format CSV, bisa dibuka di Excel.</p>
          <div class="grid grid-2">
            <button class="btn btn-outline" data-table="items" data-name="stok-items.csv">📋 Export Stok Items</button>
            <button class="btn btn-outline" data-table="stock_in" data-name="barang-masuk.csv">📥 Export Barang Masuk</button>
            <button class="btn btn-outline" data-table="stock_out" data-name="barang-keluar.csv">📤 Export Barang Keluar</button>
            <button class="btn btn-outline" data-table="pi_input" data-name="input-pi.csv">📝 Export Input PI</button>
            <button class="btn btn-outline" data-table="material_tracking" data-name="tracking-material.csv">📊 Export Tracking Material</button>
            <button class="btn btn-outline" data-table="material_masuk" data-name="material-masuk.csv">📥 Export Material Masuk</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-host"></div>
  <script type="module" src="assets/js/pages/backup-export.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}</script>
</body>
</html>
