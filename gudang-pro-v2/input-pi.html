<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input PI — Gudang Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h1>Input PI</h1>
        </div>
      </div>
      <div class="content">
        <div class="card" style="margin-bottom:16px;">
          <h2>Buat PI (Production Instruction) Baru</h2>
          <form id="pi-form">
            <div class="form-row">
              <div class="field"><label>Nomor PI</label><input type="text" id="pi_number" required placeholder="Contoh: PI-2026-001"></div>
              <div class="field"><label>Item</label>
                <select id="item_id" required><option value="">— Pilih item —</option></select>
              </div>
            </div>
            <div class="form-row">
              <div class="field"><label>Jumlah Rencana</label><input type="number" id="qty_planned" required min="0.01" step="any"></div>
              <div class="field"><label>Catatan</label><input type="text" id="note" placeholder="Opsional"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="btn-submit">+ Buat PI</button>
          </form>
        </div>

        <div class="card">
          <div class="toolbar">
            <h2 style="margin:0;">Daftar PI</h2>
            <input class="search" id="search-box" placeholder="Cari nomor PI / item...">
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>No. PI</th><th>Item</th><th>Rencana</th><th>Realisasi</th><th>Status</th><th>Dibuat</th><th></th></tr></thead>
              <tbody id="pi-body"><tr><td colspan="7" class="loading-row">Memuat...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-host"></div>
  <script type="module" src="assets/js/pages/input-pi.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}</script>
</body>
</html>
