<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirim Produksi — Gudang Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h1>Kirim Produksi</h1>
        </div>
      </div>
      <div class="content">
        <div class="card" style="margin-bottom:16px;">
          <h2>Catat Pengiriman ke Produksi</h2>
          <form id="kp-form">
            <div class="form-row">
              <div class="field"><label>Nama Material</label><input type="text" id="material_name" required></div>
              <div class="field"><label>No. Batch</label><input type="text" id="batch_no" placeholder="Opsional"></div>
            </div>
            <div class="form-row">
              <div class="field"><label>Jumlah</label><input type="number" id="qty" required min="0.01" step="any"></div>
              <div class="field"><label>Line Tujuan</label><input type="text" id="line_tujuan" placeholder="Contoh: Line Assembly 2"></div>
            </div>
            <div class="field"><label>Catatan</label><input type="text" id="note" placeholder="Opsional"></div>
            <button type="submit" class="btn btn-primary" id="btn-submit">+ Kirim ke Produksi</button>
          </form>
        </div>

        <div class="card">
          <div class="toolbar">
            <h2 style="margin:0;">Riwayat Pengiriman</h2>
            <input class="search" id="search-box" placeholder="Cari material / line...">
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Tanggal</th><th>Material</th><th>Batch</th><th>Jumlah</th><th>Line Tujuan</th><th>Catatan</th></tr></thead>
              <tbody id="kp-body"><tr><td colspan="6" class="loading-row">Memuat...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-host"></div>
  <script type="module" src="assets/js/pages/kirim-produksi.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}</script>
</body>
</html>
