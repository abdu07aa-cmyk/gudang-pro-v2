<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - QC Professional</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon">🔍</span>
                    <span class="logo-text">QC Professional</span>
                </div>
                <p class="auth-subtitle">Quality Control System</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@company.com" required value="demo@qc.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required value="demo123">
                        <button type="button" id="toggle-password" class="toggle-password">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary btn-full" id="login-btn">
                    <span id="login-text">Masuk</span>
                    <span id="login-loader" class="loader-hidden">⏳</span>
                </button>
            </form>
            
            <p class="auth-footer">
                Belum punya akun? 
                <a href="#" id="register-toggle">Daftar</a>
            </p>
            
            <div class="auth-divider"><span>atau</span></div>
            
            <div class="demo-account">
                <p class="demo-label">👨‍💻 Akun Demo</p>
                <div class="demo-credentials">
                    <span>email: <strong>demo@qc.com</strong></span>
                    <span>password: <strong>demo123</strong></span>
                </div>
                <button type="button" id="demo-login" class="btn-secondary btn-full">
                    Login Demo
                </button>
            </div>
        </div>
    </div>
    
    <!-- ===== JAVASCRIPT - PASTI TANPA MODULE ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <script src="js/app.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Cek sudah login
        if (getCurrentUser()) {
            window.location.href = '/dashboard.html';
            return;
        }
        
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const loginText = document.getElementById('login-text');
        const loginLoader = document.getElementById('login-loader');
        const togglePassword = document.getElementById('toggle-password');
        const demoBtn = document.getElementById('demo-login');
        
        // Toggle password
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });
        
        // Login
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!email || !password) {
                alert('⚠️ Isi email dan password!');
                return;
            }
            
            loginText.textContent = 'Memproses...';
            loginLoader.classList.remove('loader-hidden');
            loginBtn.disabled = true;
            
            const result = await loginUser(email, password);
            
            loginText.textContent = 'Masuk';
            loginLoader.classList.add('loader-hidden');
            loginBtn.disabled = false;
            
            if (result.success) {
                window.location.href = '/dashboard.html';
            } else {
                alert('❌ Login gagal: ' + result.message);
            }
        });
        
        // Demo
        demoBtn.addEventListener('click', function() {
            emailInput.value = 'demo@qc.com';
            passwordInput.value = 'demo123';
            form.dispatchEvent(new Event('submit'));
        });
        
        console.log('✅ Login page ready (no modules)');
    });
    </script>
</body>
</html>
