<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Akun — Gudang Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2226">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="mark">GP</div>
        <h1>Daftar Akun</h1>
        <p>Akun baru perlu disetujui admin sebelum bisa login</p>
      </div>
      <div class="auth-error" id="auth-error"></div>
      <form id="register-form">
        <div class="field">
          <label for="full_name">Nama Lengkap</label>
          <input type="text" id="full_name" required placeholder="Nama kamu">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="nama@perusahaan.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="Minimal 6 karakter">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="btn-submit">Daftar</button>
      </form>
      <div class="auth-foot">Sudah punya akun? <a href="login.html" style="color:var(--amber-dark);font-weight:600;">Login</a></div>
    </div>
  </div>
  <div id="toast-host"></div>
  <script type="module" src="assets/js/pages/register.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}</script>
</body>
</html>
