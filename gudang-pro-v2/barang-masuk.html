<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barang Masuk — Gudang Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h1>Barang Masuk</h1>
        </div>
      </div>
      <div class="content">
        <div class="card" style="margin-bottom:16px;">
          <h2>Catat Barang Masuk</h2>
          <form id="tx-form">
            <div class="form-row">
              <div class="field"><label>Item</label>
                <select id="item_id" required><option value="">— Pilih item —</option></select>
              </div>
              <div class="field"><label>Jumlah</label><input type="number" id="qty" required min="0.01" step="any"></div>
            </div>
            <div class="form-row">
              <div class="field"><label>Asal / Supplier</label><input type="text" id="party" placeholder="Contoh: PT Sumber Jaya"></div>
              <div class="field"><label>Catatan</label><input type="text" id="note" placeholder="Opsional"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="btn-submit">+ Catat Barang Masuk</button>
          </form>
        </div>

        <div class="card">
          <div class="toolbar">
            <h2 style="margin:0;">Riwayat Barang Masuk</h2>
            <input class="search" id="search-box" placeholder="Cari item...">
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Tanggal</th><th>SKU</th><th>Item</th><th>Jumlah</th><th>Asal</th><th>Catatan</th></tr></thead>
              <tbody id="tx-body"><tr><td colspan="6" class="loading-row">Memuat...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-host"></div>
  <script type="module" src="assets/js/pages/barang-masuk.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}</script>
</body>
</html>
