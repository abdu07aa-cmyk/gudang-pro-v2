<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC Inspection — Gudang Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h1>QC Inspection</h1>
        </div>
      </div>
      <div class="content">
        <div class="card" style="margin-bottom:16px;">
          <h2>Catat Hasil Inspeksi QC</h2>
          <form id="qc-form">
            <div class="form-row">
              <div class="field"><label>Nama Material</label><input type="text" id="material_name" required></div>
              <div class="field"><label>No. Batch</label><input type="text" id="batch_no" placeholder="Opsional"></div>
            </div>
            <div class="form-row">
              <div class="field"><label>Jumlah Diperiksa</label><input type="number" id="qty_inspected" required min="0.01" step="any"></div>
              <div class="field"><label>Jumlah Lolos (Pass)</label><input type="number" id="qty_pass" required min="0" step="any"></div>
            </div>
            <div class="form-row">
              <div class="field"><label>Jumlah NG (Reject)</label><input type="number" id="qty_ng" required min="0" step="any"></div>
              <div class="field"><label>Alasan NG</label><input type="text" id="ng_reason" placeholder="Contoh: Gores, Retak, Ukuran tidak sesuai"></div>
            </div>
            <div class="field"><label>Catatan Inspektor</label><input type="text" id="inspector_note" placeholder="Opsional"></div>
            <button type="submit" class="btn btn-primary" id="btn-submit">+ Catat Inspeksi</button>
          </form>
        </div>

        <div class="card">
          <div class="toolbar">
            <h2 style="margin:0;">Riwayat Inspeksi</h2>
            <input class="search" id="search-box" placeholder="Cari material / batch...">
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Tanggal</th><th>Material</th><th>Batch</th><th>Diperiksa</th><th>Pass</th><th>NG</th><th>Alasan NG</th></tr></thead>
              <tbody id="qc-body"><tr><td colspan="7" class="loading-row">Memuat...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-host"></div>
  <script type="module" src="assets/js/pages/qc-inspection.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}</script>
</body>
</html>
