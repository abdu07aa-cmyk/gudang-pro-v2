<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - QC Professional</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon">🔍</span>
                    <span class="logo-text">QC Professional</span>
                </div>
                <p class="auth-subtitle">Quality Control System</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@company.com" required value="demo@qc.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required value="demo123">
                        <button type="button" id="toggle-password" class="toggle-password">👁️</button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Ingat saya</span>
                    </label>
                    <a href="#" class="forgot-password">Lupa password?</a>
                </div>
                
                <button type="submit" class="btn-primary btn-full" id="login-btn">
                    <span id="login-text">Masuk</span>
                    <span id="login-loader" class="loader-hidden">⏳</span>
                </button>
            </form>
            
            <p class="auth-footer">
                Belum punya akun? 
                <a href="#" id="register-toggle">Daftar</a>
            </p>
            
            <div class="auth-divider"><span>atau</span></div>
            
            <div class="demo-account">
                <p class="demo-label">👨‍💻 Akun Demo</p>
                <div class="demo-credentials">
                    <span>email: <strong>demo@qc.com</strong></span>
                    <span>password: <strong>demo123</strong></span>
                </div>
                <button type="button" id="demo-login" class="btn-secondary btn-full">
                    Login Demo
                </button>
            </div>
        </div>
    </div>
<!-- ===== JAVASCRIPT ===== -->
<!-- Gunakan CDN yang PALING STABIL -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
</script>

<!-- TAMBAHKAN INI UNTUK DEBUG -->
<script>
    console.log('Supabase loaded:', typeof supabase !== 'undefined');
    console.log('SupabaseJs loaded:', typeof supabaseJs !== 'undefined');
    // Jika supabase tersedia, simpan ke window
    if (typeof supabase !== 'undefined') {
        window.supabase = supabase;
        console.log('✅ Supabase saved to window');
    }
</script>

<script src="js/app.js"></script>
</body>
</html>
