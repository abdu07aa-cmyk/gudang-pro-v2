<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola User — Gudang Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h1>Kelola User</h1>
        </div>
      </div>
      <div class="content" id="page-content">
        <div class="card">
          <div class="toolbar">
            <h2 style="margin:0;">Daftar User</h2>
            <input class="search" id="search-box" placeholder="Cari nama / status...">
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nama</th><th>Role</th><th>Status</th><th>Terdaftar</th><th>Aksi</th></tr></thead>
              <tbody id="user-body"><tr><td colspan="5" class="loading-row">Memuat...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-host"></div>
  <script type="module" src="assets/js/pages/kelola-user.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}</script>
</body>
</html>
