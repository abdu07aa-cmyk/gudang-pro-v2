<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - QC Professional</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
</head>
<body>
    
    <nav class="bottom-nav">
        <a href="dashboard.html" class="active"><span>🏠</span><span>Dashboard</span></a>
        <a href="inspection.html"><span>📋</span><span>Inspeksi</span></a>
        <a href="#"><span>📊</span><span>Defect</span></a>
        <a href="#"><span>📜</span><span>Riwayat</span></a>
        <a href="#" id="logout-btn"><span>🚪</span><span>Keluar</span></a>
    </nav>
    
    <main style="padding: 20px; max-width: 1200px; margin: 0 auto; padding-bottom: 80px;">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <h1 style="font-size: 24px;">📊 QC Dashboard</h1>
            <span id="user-email" style="color: #64748b; font-size: 14px; background: #f1f5f9; padding: 6px 16px; border-radius: 20px;"></span>
        </header>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px;">
            <div class="card" style="padding: 20px; border-radius: 16px; background: white;">
                <div style="color: #64748b; font-size: 13px;">Total Inspeksi</div>
                <div style="font-size: 28px; font-weight: 700;" id="total-inspections">0</div>
            </div>
            <div class="card" style="padding: 20px; border-radius: 16px; background: white;">
                <div style="color: #64748b; font-size: 13px;">Defect Rate</div>
                <div style="font-size: 28px; font-weight: 700;" id="defect-rate">0%</div>
            </div>
            <div class="card" style="padding: 20px; border-radius: 16px; background: white;">
                <div style="color: #64748b; font-size: 13px;">Passed</div>
                <div style="font-size: 28px; font-weight: 700; color: #16a34a;" id="passed">0</div>
            </div>
            <div class="card" style="padding: 20px; border-radius: 16px; background: white;">
                <div style="color: #64748b; font-size: 13px;">Rejected</div>
                <div style="font-size: 28px; font-weight: 700; color: #dc2626;" id="rejected">0</div>
            </div>
        </div>
        
        <div class="card" style="padding: 24px; text-align: center; background: white; border-radius: 16px;">
            <p style="color: #64748b; margin-bottom: 16px;">✅ Dashboard siap digunakan.</p>
            <a href="inspection.html" class="btn-primary">Mulai Inspeksi</a>
        </div>
    </main>
    
    <!-- ===== JAVASCRIPT ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <script src="js/app.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const user = getCurrentUser();
        if (!user) {
            window.location.href = '/login.html';
            return;
        }
        
        document.getElementById('user-email').textContent = '👤 ' + user.email;
        
        document.getElementById('logout-btn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('Yakin keluar?')) logoutUser();
        });
        
        loadDashboardStats();
        console.log('✅ Dashboard ready (no modules)');
    });
    </script>
</body>
</html>
