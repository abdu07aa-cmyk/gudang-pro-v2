<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Eksekutif — Gudang Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h1>Laporan Eksekutif</h1>
        </div>
      </div>
      <div class="content">
        <div class="grid grid-4">
          <div class="card stat-tile"><div class="tag">Total Item</div><div class="value" id="stat-items">–</div></div>
          <div class="card stat-tile"><div class="tag">Total Nilai Transaksi Masuk</div><div class="value ok" id="stat-in">–</div><div class="hint">6 bulan terakhir</div></div>
          <div class="card stat-tile"><div class="tag">Total Nilai Transaksi Keluar</div><div class="value" id="stat-out">–</div><div class="hint">6 bulan terakhir</div></div>
          <div class="card stat-tile"><div class="tag">PI Aktif</div><div class="value alert" id="stat-pi">–</div><div class="hint">draft + proses</div></div>
        </div>

        <div class="card" style="margin-top:16px;">
          <h2>Tren Barang Masuk vs Keluar (6 Bulan Terakhir)</h2>
          <canvas id="trend-chart" height="90"></canvas>
        </div>

        <div class="card" style="margin-top:16px;">
          <h2>Top 5 Item Paling Banyak Keluar</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>SKU</th><th>Nama</th><th>Total Keluar</th></tr></thead>
              <tbody id="top-out-body"><tr><td colspan="3" class="loading-row">Memuat...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-host"></div>
  <script type="module" src="assets/js/pages/laporan-eksekutif.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}</script>
</body>
</html>
