<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QC Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- Mobile Navigation Bottom (seperti app) -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="active">
            <svg>...</svg>
            <span>Dashboard</span>
        </a>
        <a href="inspection.html">
            <svg>...</svg>
            <span>Inspeksi</span>
        </a>
        <a href="defect-report.html">
            <svg>...</svg>
            <span>Defect</span>
        </a>
        <a href="history.html">
            <svg>...</svg>
            <span>Riwayat</span>
        </a>
        <a href="settings.html">
            <svg>...</svg>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="app-header">
            <h1>📊 QC Dashboard</h1>
            <span class="badge">Shift: Pagi</span>
        </header>

        <!-- KPI Cards -->
        <section class="kpi-grid">
            <div class="kpi-card">
                <span class="label">Total Inspeksi</span>
                <span class="value" id="total-inspections">1,284</span>
                <span class="trend up">↑ 12%</span>
            </div>
            <div class="kpi-card">
                <span class="label">Defect Rate</span>
                <span class="value" id="defect-rate">2.4%</span>
                <span class="trend down">↓ 0.3%</span>
            </div>
            <div class="kpi-card">
                <span class="label">Passed</span>
                <span class="value" id="passed">1,253</span>
                <span class="trend up">↑ 8%</span>
            </div>
            <div class="kpi-card">
                <span class="label">Rejected</span>
                <span class="value" id="rejected">31</span>
                <span class="trend down">↓ 5%</span>
            </div>
        </section>

        <!-- Grafik Defect (Chart.js) -->
        <section class="chart-container">
            <h3>Top 5 Defect Types</h3>
            <canvas id="defectChart" height="200"></canvas>
        </section>

        <!-- Tabel Inspeksi Terbaru (mobile scroll) -->
        <section class="recent-inspections">
            <h3>Inspeksi Terakhir</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Produk</th><th>Status</th><th>Qty</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>PCB-A01</td><td><span class="status pass">✓ Pass</span></td><td>500</td></tr>
                        <tr><td>PCB-B02</td><td><span class="status fail">✗ Fail</span></td><td>200</td></tr>
                        <tr><td>PCB-C03</td><td><span class="status pass">✓ Pass</span></td><td>350</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
