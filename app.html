<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TrackFlow — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <h1>TrackFlow</h1>
  </div>
  <div class="topbar-right">
    <span class="user-name" id="userName"></span>
    <span class="role-chip" id="roleChip"></span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Keluar</button>
  </div>
</div>

<div class="container">

  <div class="stats">
    <div class="stat-card c-total">
      <div class="stat-num" id="statTotal">–</div>
      <div class="stat-label">Total Order</div>
    </div>
    <div class="stat-card c-qc">
      <div class="stat-num" id="statQc">–</div>
      <div class="stat-label">Menunggu QC</div>
    </div>
    <div class="stat-card c-ng">
      <div class="stat-num" id="statNg">–</div>
      <div class="stat-label">N.G Material</div>
    </div>
    <div class="stat-card c-done">
      <div class="stat-num" id="statDone">–</div>
      <div class="stat-label">Selesai</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Cari PI No, Brand, atau SJ/DO No...">
    </div>
    <button class="btn btn-primary btn-sm" id="newOrderBtn" style="display:none; width:auto;">+ Order Baru</button>
  </div>

  <div id="listWrap">
    <div class="loader">Memuat data...</div>
  </div>

</div>

<button class="fab" id="fabBtn" style="display:none;">+</button>

<!-- ============ Order Modal ============ -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Order Baru</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <form id="orderForm">
      <input type="hidden" id="orderId">

      <!-- GUDANG -->
      <div class="section-label gudang" style="margin-bottom:10px;"><span class="dot"></span> PI Data — Gudang</div>
      <div class="form-grid" id="gudangFields">
        <div class="field"><label>PI No</label><input type="text" id="f_pi_no"></div>
        <div class="field"><label>PI Date</label><input type="date" id="f_pi_date"></div>
        <div class="field"><label>PI Qty</label><input type="number" step="any" id="f_pi_qty"></div>
        <div class="field"><label>Brand</label><input type="text" id="f_brand"></div>
        <div class="field span-2"><label>PI Specification</label><input type="text" id="f_pi_specification"></div>
        <div class="field"><label>SJ/DO No</label><input type="text" id="f_sj_do_no"></div>
        <div class="field"><label>SJ/DO Date</label><input type="date" id="f_sj_do_date"></div>
        <div class="field"><label>SJ/DO Qty</label><input type="number" step="any" id="f_sj_do_qty"></div>
        <div class="field"><label>SJ/DO Unit</label><input type="text" id="f_sj_do_unit"></div>
        <div class="field"><label>Delivery Date to QC</label><input type="date" id="f_delivery_date_to_qc"></div>
        <div class="field"><label>Status Material</label>
          <select id="f_status_material">
            <option value="">–</option>
            <option>Menunggu Kirim</option>
            <option>Terkirim ke QC</option>
          </select>
        </div>
      </div>
      <div class="locked-note" id="gudangLocked" style="display:none;">Bagian ini hanya bisa diubah oleh Gudang.</div>

      <div style="height:18px;"></div>

      <!-- QC -->
      <div class="section-label qc" style="margin-bottom:10px;"><span class="dot"></span> Incoming QC</div>
      <div class="form-grid" id="qcFields">
        <div class="field"><label>Inspection Date</label><input type="date" id="f_inspection_date"></div>
        <div class="field"><label>QC Status</label>
          <select id="f_qc_status">
            <option value="">–</option>
            <option>Pending</option>
            <option>Good</option>
            <option>NG</option>
            <option>Partial</option>
          </select>
        </div>
        <div class="field"><label>Good Material</label><input type="number" step="any" id="f_good_material"></div>
        <div class="field"><label>N.G Material</label><input type="number" step="any" id="f_ng_material"></div>
      </div>
      <div class="locked-note" id="qcLocked" style="display:none;">Bagian ini hanya bisa diubah oleh Quality Control.</div>

      <div style="height:18px;"></div>

      <!-- SUPPLY -->
      <div class="section-label supply" style="margin-bottom:10px;"><span class="dot"></span> Supply Material</div>
      <div class="form-grid" id="supplyFields">
        <div class="field"><label>Delivery Supply Material</label><input type="date" id="f_delivery_date_supply"></div>
        <div class="field"><label>Supply Date</label><input type="date" id="f_supply_date"></div>
        <div class="field"><label>Supply Qty</label><input type="number" step="any" id="f_supply_qty"></div>
        <div class="field"><label>Total Material</label><input type="number" step="any" id="f_total_material"></div>
        <div class="field span-2"><label>Status</label>
          <select id="f_final_status">
            <option value="">–</option>
            <option>Pending</option>
            <option>Proses</option>
            <option>Selesai</option>
          </select>
        </div>
      </div>
      <div class="locked-note" id="supplyLocked" style="display:none;">Bagian ini hanya bisa diubah oleh Supply Material.</div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="deleteBtn" style="display:none;">Hapus</button>
        <button type="button" class="btn btn-ghost" id="cancelBtn">Batal</button>
        <button type="submit" class="btn btn-primary" style="width:auto;">Simpan</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
