<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan QR — Gudang Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  #qr-reader{ max-width:360px; margin:0 auto; border-radius:8px; overflow:hidden; }
  #qr-reader video{ border-radius:8px; }
  .scan-result{ display:none; }
  .scan-result.show{ display:block; }
</style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h1>Scan QR</h1>
        </div>
      </div>
      <div class="content">
        <div class="card" style="max-width:420px;margin:0 auto 16px;text-align:center;">
          <h2>Arahkan Kamera ke QR Code Item</h2>
          <div id="qr-reader"></div>
          <p style="color:var(--ink-soft);font-size:12.5px;margin-top:10px;">Butuh izin akses kamera. Kalau tidak muncul, cek permission browser.</p>
        </div>

        <div class="card scan-result" id="result-card" style="max-width:420px;margin:0 auto;">
          <h2 id="result-name">-</h2>
          <p style="font-family:var(--font-mono);color:var(--ink-soft);margin-top:-8px;" id="result-sku">-</p>
          <p>Stok saat ini: <b class="num" id="result-stock">-</b> <span id="result-unit"></span></p>

          <div class="form-row">
            <div class="field"><label>Jumlah</label><input type="number" id="qty" min="0.01" step="any" placeholder="0"></div>
            <div class="field"><label>Keterangan</label><input type="text" id="note" placeholder="Opsional"></div>
          </div>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-primary" id="btn-in" style="flex:1;justify-content:center;">📥 Catat Masuk</button>
            <button class="btn btn-outline" id="btn-out" style="flex:1;justify-content:center;">📤 Catat Keluar</button>
          </div>
          <button class="btn btn-outline" id="btn-rescan" style="width:100%;justify-content:center;margin-top:10px;">🔄 Scan Lagi</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-host"></div>
  <script type="module" src="assets/js/pages/scan-qr.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}</script>
</body>
</html>
